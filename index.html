<!DOCTYPE html>
<html lang="en">

  <!-- Single-file build of the Online Examination System (standalone mode). Generated by scripts/build-standalone.mjs -->

/* Online Examination System - stylesheet (no external fonts or libraries)
   Look: an exam answer sheet. Ink-indigo chrome, ultramarine actions, a marker-yellow highlight, and answer
   "bubbles" (A B C D) as the one recurring motif - on the sign-in screen and as the option markers during an exam.
   Light and dark themes follow the system setting. */

:root {
  color-scheme: light dark;

  --ink: #14163a;
  --ink-2: #1d2050;
  --marker: #ffcf4a;

  --primary: #3b3fd8;
  --primary-dark: #2c30b4;
  --primary-soft: #ecedff;
  --primary-ring: rgba(59, 63, 216, .28);

  --bg: #f5f5fb;
  --card: #ffffff;
  --text: #1a1b3a;
  --muted: #62648a;
  --border: #e2e2f0;
  --border-strong: #c9cae3;
  --head-bg: #f0f0fa;
  --hover-bg: #f8f8fe;

  --success: #0f9d6b;
  --success-bg: #dcf7ec;
  --success-ink: #07694a;
  --danger: #e5484d;
  --danger-bg: #ffe5e6;
  --danger-ink: #a3242a;
  --warn: #e19400;
  --warn-bg: #fff1cf;
  --warn-ink: #8a5600;

  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(24, 26, 90, .06), 0 8px 24px -8px rgba(24, 26, 90, .12);
  --shadow-lg: 0 24px 60px -12px rgba(14, 16, 60, .45);

  --font-body: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Charter, Georgia, serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: #0b0c1f;
    --ink-2: #14163a;
    --primary: #8b8dff;
    --primary-dark: #a9abff;
    --primary-soft: #23265a;
    --primary-ring: rgba(139, 141, 255, .35);

    --bg: #0f1026;
    --card: #171937;
    --text: #ececff;
    --muted: #9fa1cb;
    --border: #2a2d57;
    --border-strong: #3d4078;
    --head-bg: #1d2046;
    --hover-bg: #1b1e42;

    --success: #35d39c;
    --success-bg: #0f3a2f;
    --success-ink: #8cf0cc;
    --danger: #ff7a80;
    --danger-bg: #43191e;
    --danger-ink: #ffb3b6;
    --warn: #ffbf3c;
    --warn-bg: #43330c;
    --warn-ink: #ffd987;

    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -10px rgba(0, 0, 0, .6);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -.01em; line-height: 1.2; color: var(--text); }
h1 { font-size: clamp(1.7rem, 3.2vw, 2.3rem); margin: .25rem 0 .6rem; }
h2 { font-size: 1.25rem; margin: 0 0 .5rem; }
p { margin: 0 0 .75rem; }
a { color: var(--primary); text-underline-offset: 3px; }
::selection { background: var(--marker); color: var(--ink); }

.muted { color: var(--muted); }
.small { font-size: .85rem; }
.ok-text { color: var(--success); }
.error-text { color: var(--danger); }
.warn-text { color: var(--warn); }
.pre { white-space: pre-wrap; }
.skip-link { position: absolute; left: -999px; top: 0; background: var(--marker); color: var(--ink); padding: .5rem 1rem; z-index: 100; font-weight: 700; }
.skip-link:focus { left: 0; }
.noscript { padding: 1rem; background: var(--danger-bg); color: var(--danger-ink); text-align: center; }

/* ---- top bar ---- */
.topbar {
  display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
  background: var(--ink); color: #fff; padding: .7rem clamp(1rem, 3vw, 2rem);
  border-bottom: 3px solid var(--marker);
  position: sticky; top: 0; z-index: 20;
}
.topbar[hidden] { display: none; }
.brand {
  display: inline-flex; align-items: center; gap: .65rem;
  color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; text-decoration: none; letter-spacing: -.01em;
}
.brand::before {                       /* the logo: a ticked answer bubble */
  content: "\2713"; display: grid; place-items: center; flex: none;
  width: 1.8rem; height: 1.8rem; border-radius: 50%;
  background: var(--marker); color: var(--ink); font: 900 1rem/1 var(--font-body);
}
.topnav { display: flex; gap: .35rem; flex: 1; }
.topnav a { color: #c9cbf5; text-decoration: none; padding: .35rem .85rem; border-radius: 999px; font-weight: 600; font-size: .95rem; }
.topnav a:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.topnav a.active { background: #fff; color: var(--ink); }
.user { display: flex; align-items: center; gap: .85rem; font-weight: 600; color: #e6e7ff; }
.topbar .btn-secondary { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .22); box-shadow: none; }
.topbar .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, .22); }

.view { max-width: 1200px; margin: 0 auto; padding: 1.75rem clamp(1rem, 3vw, 2rem) 4rem; outline: none; }

/* ---- surfaces ---- */
.card, .panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.35rem 1.6rem; box-shadow: var(--shadow);
}
.panel { margin-top: 1.1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1.1rem; margin-top: 1.25rem; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.actions { display: flex; gap: .55rem; flex-wrap: wrap; align-items: center; margin-top: .85rem; }
.toolbar { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; margin-bottom: .85rem; }
.empty { color: var(--muted); padding: 2rem 1rem; margin: 0; text-align: center; border: 2px dashed var(--border-strong); border-radius: var(--radius); }
.summary { margin-top: .85rem; font-weight: 600; }

/* ---- tabs (pills) ---- */
.tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: .75rem 0 .25rem; padding: .3rem; background: var(--head-bg); border-radius: 999px; width: fit-content; max-width: 100%; }
.tab { padding: .45rem 1.1rem; text-decoration: none; color: var(--muted); border-radius: 999px; font-weight: 600; font-size: .95rem; transition: background .15s, color .15s; }
.tab:hover { color: var(--text); background: var(--card); }
.tab.active { color: #fff; background: var(--primary); box-shadow: 0 4px 12px -4px var(--primary-ring); }
@media (prefers-color-scheme: dark) { .tab.active { color: var(--ink); } }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  border: 1px solid transparent; border-radius: var(--radius-sm); padding: .6rem 1.2rem; font: inherit; font-weight: 700; font-size: .95rem;
  cursor: pointer; text-decoration: none; text-align: center; color: #fff; background: var(--primary);
  box-shadow: 0 6px 16px -8px var(--primary-ring), 0 1px 0 rgba(255, 255, 255, .18) inset;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease, filter .12s ease;
}
@media (prefers-color-scheme: dark) { .btn { color: var(--ink); } }
.btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: translateY(0); filter: brightness(.94); }
.btn:disabled { background: var(--head-bg); color: var(--muted); cursor: not-allowed; box-shadow: none; border-color: var(--border); }
.btn-secondary { background: var(--card); color: var(--text); border-color: var(--border-strong); box-shadow: none; }
@media (prefers-color-scheme: dark) { .btn-secondary { color: var(--text); } }
.btn-secondary:hover:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); filter: none; }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
@media (prefers-color-scheme: dark) { .btn-success, .btn-danger { color: var(--ink); } }
.btn-block { display: flex; width: 100%; margin-top: .65rem; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 1px; }

/* ---- forms ---- */
input, select, textarea {
  font: inherit; color: var(--text); background: var(--card);
  border: 1.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: .6rem .8rem;
  transition: border-color .12s, box-shadow .12s;
}
input:hover, select:hover, textarea:hover { border-color: var(--primary); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-ring); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
input[type="checkbox"], input[type="radio"] { padding: 0; accent-color: var(--primary); }
textarea { width: 100%; resize: vertical; }
.field { display: block; margin-bottom: .95rem; }
.field input:not([type="checkbox"]), .field select, .field textarea { display: block; width: 100%; }
.field-label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: .3rem; }
.field-hint { display: block; font-size: .82rem; color: var(--muted); margin-top: .2rem; }
.inline { display: inline-flex; align-items: center; gap: .5rem; font-weight: 600; }
.check { display: inline-flex; align-items: center; gap: .5rem; cursor: pointer; font-weight: 600; }
.form-error { color: var(--danger); min-height: 1.4rem; margin: .25rem 0; font-weight: 600; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1rem; }
.form-grid > .form-error, .form-grid > .check { grid-column: 1 / -1; }
.form-grid > .field:first-child, .form-grid > .field:nth-child(2), .form-grid > .field:nth-child(3) { grid-column: 1 / -1; }

/* ---- sign in / register ---- */
.auth-wrap {
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 1.5rem; align-items: stretch;
  max-width: 1040px; margin: 1.5vh auto 0;
}
.auth-card { width: 100%; max-width: none; padding: 2rem 2.1rem; align-self: center; }
.auth-card h1 { margin-top: 0; }

.auth-hero {
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 2.4rem; align-self: start;
  background: linear-gradient(160deg, var(--ink-2), var(--ink) 70%);
  color: #fff; border-radius: 22px; padding: 2.4rem 2.2rem; box-shadow: var(--shadow-lg);
}
.auth-hero::after {                       /* soft marker glow behind the sheet */
  content: ""; position: absolute; width: 22rem; height: 22rem; right: -8rem; bottom: -9rem; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 207, 74, .22), transparent 65%); pointer-events: none;
}
.auth-hero h2 { color: #fff; font-size: clamp(1.8rem, 3.4vw, 2.6rem); line-height: 1.1; margin: 0 0 .9rem; }
.auth-hero p { color: rgba(236, 237, 255, .78); max-width: 30ch; margin: 0; }

.omr { position: relative; z-index: 1; margin-top: auto; display: grid; gap: .7rem; padding: 1.2rem 1.3rem; border-radius: 16px;
  background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14); width: fit-content; }
.omr-row { display: flex; align-items: center; gap: .75rem; }
.omr-no { width: 1.5rem; text-align: right; font: .8rem var(--font-mono); color: rgba(255, 255, 255, .5); }
.omr-b {
  width: 1.85rem; height: 1.85rem; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid rgba(255, 255, 255, .32); font-size: .72rem; font-weight: 700; color: rgba(255, 255, 255, .55);
}
.omr-b.on { background: var(--marker); border-color: var(--marker); color: var(--ink); animation: fill-in .45s cubic-bezier(.3, 1.4, .5, 1) both; }
.omr-row:nth-child(1) .on { animation-delay: .35s; }
.omr-row:nth-child(2) .on { animation-delay: .65s; }
.omr-row:nth-child(3) .on { animation-delay: .95s; }
.omr-row:nth-child(4) .on { animation-delay: 1.25s; }
.omr-row:nth-child(5) .on { animation-delay: 1.55s; }
@keyframes fill-in { from { background: transparent; border-color: rgba(255, 255, 255, .32); color: rgba(255, 255, 255, .55); transform: scale(.82); } }

.segmented { display: flex; gap: .25rem; padding: .25rem; background: var(--head-bg); border-radius: 999px; margin-bottom: 1.1rem; }
.seg { flex: 1; padding: .5rem .8rem; border: 0; border-radius: 999px; background: transparent; font: inherit; font-weight: 700; cursor: pointer; color: var(--muted); transition: background .15s, color .15s; }
.seg:hover { color: var(--text); }
.seg.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px -4px var(--primary-ring); }
@media (prefers-color-scheme: dark) { .seg.active { color: var(--ink); } }

/* ---- tables ---- */
.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); }
.table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.table th { text-align: left; background: var(--head-bg); color: var(--muted); padding: .7rem .9rem; font-size: .85rem; font-weight: 700; vertical-align: bottom; }
.table th:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.table th:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.table td { padding: .75rem .9rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr { transition: background .12s; }
.table tbody tr:hover { background: var(--hover-bg); }
.table .actions { margin-top: 0; gap: .35rem; min-width: 12.5rem; }
.table .btn { padding: .35rem .75rem; font-size: .85rem; box-shadow: none; }
.opt-list { margin: 0; padding-left: 1.2rem; font-size: .9rem; }
.badge { display: inline-block; white-space: nowrap; padding: .15rem .65rem; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--head-bg); color: var(--muted); }
.badge-pass { background: var(--success-bg); color: var(--success-ink); }
.badge-fail { background: var(--danger-bg); color: var(--danger-ink); }
.badge-warn { background: var(--warn-bg); color: var(--warn-ink); }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: .4rem; padding: 0; margin: .4rem 0 1rem; }
.chips li { background: var(--primary-soft); color: var(--primary-dark); border-radius: 999px; padding: .15rem .75rem; font-size: .83rem; font-weight: 600; }
.exam-card { display: flex; flex-direction: column; box-shadow: inset 0 4px 0 var(--primary), var(--shadow); padding-top: 1.6rem; }
.exam-card h2 { margin: 0 0 .35rem; }
.exam-card > p { flex: 1; }
.exam-card > .btn { align-self: flex-start; margin-top: .25rem; }

/* ---- instructions / result ---- */
.instructions { max-width: 800px; margin: 1.25rem auto; }
.notice { background: var(--primary-soft); border-left: 4px solid var(--marker); padding: .8rem 1.05rem; border-radius: 4px var(--radius-sm) var(--radius-sm) 4px; margin: .85rem 0; }
.rules { padding-left: 1.2rem; }
.rules li { margin-bottom: .3rem; }
.result { --accent: var(--primary); max-width: 620px; margin: 2.5rem auto; text-align: center; padding: 2.5rem 2rem 2.2rem; box-shadow: inset 0 6px 0 var(--accent), var(--shadow); }
.result:has(.verdict.ok-text) { --accent: var(--success); }
.result:has(.verdict.error-text) { --accent: var(--danger); }
.result .actions { justify-content: center; }
.verdict { font: 800 clamp(2.6rem, 8vw, 3.8rem)/1 var(--font-display); letter-spacing: .02em; margin: .5rem 0 1rem; }
.big { font-size: 1.25rem; font-weight: 700; margin-bottom: .3rem; font-variant-numeric: tabular-nums; }
.review-item { margin-top: 1.1rem; }
.review-options { list-style: none; padding: 0; margin: 0; }
.review-options li { padding: .55rem .8rem; border-radius: var(--radius-sm); margin-bottom: .35rem; border: 1.5px solid transparent; }
.r-correct { background: var(--success-bg); color: var(--success-ink); border-color: var(--success) !important; }
.r-wrong { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger) !important; }

/* ---- taking an exam ---- */
.exam-bar {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  background: var(--ink); color: #fff; border-radius: var(--radius); border-bottom: 4px solid var(--marker);
  padding: .85rem 1.4rem; margin-bottom: 1.1rem; position: sticky; top: .6rem; z-index: 5; box-shadow: var(--shadow-lg);
}
.exam-bar h1 { color: #fff; font-size: 1.35rem; margin: 0; }
.exam-bar .muted { color: #b9bbe8; }
.timer {
  font: 700 1.9rem var(--font-mono); letter-spacing: .06em; font-variant-numeric: tabular-nums;
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); border-radius: var(--radius-sm); padding: .15rem .8rem;
}
.timer.warn { color: #ffe08a; border-color: rgba(255, 224, 138, .6); }
.timer.danger { color: #ffc2c4; border-color: rgba(255, 140, 145, .8); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.exam-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 1.1rem; align-items: start; }
.side { position: sticky; top: 6.5rem; }
.q-head { margin: 0; font-family: var(--font-body); font-size: .95rem; font-weight: 700; color: var(--muted); letter-spacing: 0; }
.q-text { font: 600 1.3rem/1.45 var(--font-display); margin: 1.1rem 0 1.25rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.options { display: grid; gap: .65rem; margin-bottom: .5rem; }
.option {
  position: relative; display: flex; align-items: center; gap: .9rem; border: 2px solid var(--border); border-radius: var(--radius);
  padding: .8rem 1.1rem; cursor: pointer; background: var(--card); overflow-wrap: anywhere;
  transition: border-color .12s, background .12s, transform .12s;
}
.option:hover { border-color: var(--primary); transform: translateX(3px); }
.option.selected { border-color: var(--primary); background: var(--primary-soft); }
.option input { position: absolute; opacity: 0; width: 1px; height: 1px; }       /* the letter bubble is the visible control */
.option:focus-within { box-shadow: 0 0 0 4px var(--primary-ring); }
.letter {
  flex: none; width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid var(--border-strong); font-weight: 800; font-size: .9rem; color: var(--muted); background: var(--card);
  transition: background .15s, border-color .15s, color .15s, transform .15s;
}
.option.selected .letter { background: var(--primary); border-color: var(--primary); color: #fff; transform: scale(1.08); }
@media (prefers-color-scheme: dark) { .option.selected .letter { color: var(--ink); } }
.status { min-height: 1.5rem; margin-top: .85rem; font-weight: 600; }
.palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: .45rem; margin: .6rem 0 1rem; }
.pal {
  border: 2px solid transparent; border-radius: 50%; aspect-ratio: 1; padding: 0; font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer;
  background: var(--head-bg); color: var(--muted); border-color: var(--border-strong); transition: transform .12s;
}
.pal:hover:not(:disabled) { transform: scale(1.1); }
.pal.answered { background: var(--success); border-color: var(--success); color: #fff; }
.pal.marked { background: var(--warn); border-color: var(--warn); color: #fff; }
@media (prefers-color-scheme: dark) { .pal.answered, .pal.marked { color: var(--ink); } }
.pal.current { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--primary); }
.pal:disabled { opacity: .5; cursor: not-allowed; }
.legend { list-style: none; padding: 0; margin: 0 0 .5rem; font-size: .9rem; }
.legend li::before { content: "●"; margin-right: .5rem; }
.l-answered::before { color: var(--success); }
.l-marked::before { color: var(--warn); }
.l-none::before { color: var(--border-strong); }

/* ---- dialogs and toasts ---- */
.overlay {
  position: fixed; inset: 0; background: rgba(10, 11, 40, .6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: flex-start; justify-content: center; padding: 6vh 1rem; overflow-y: auto; z-index: 50;
  animation: fade-in .16s ease-out;
}
.dialog {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 500px; padding: 1.5rem 1.7rem;
  box-shadow: var(--shadow-lg); animation: pop-in .2s cubic-bezier(.2, 1.2, .4, 1);
}
.dialog-wide { max-width: 780px; }
.dialog-title { margin-top: 0; }
.dialog-actions { display: flex; justify-content: flex-end; gap: .55rem; margin-top: 1.1rem; }
.toasts { position: fixed; right: 1rem; bottom: 1rem; display: grid; gap: .55rem; z-index: 60; max-width: 380px; }
.toast {
  background: var(--ink-2); color: #fff; padding: .8rem 1.1rem; border-radius: var(--radius-sm); border-left: 5px solid var(--marker);
  box-shadow: var(--shadow-lg); animation: slide-in .25s ease-out;
}
.toast-success { background: #0b5b41; border-left-color: #35d39c; }
.toast-error { background: #7d1d22; border-left-color: #ff7a80; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes pop-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }

    }

  if (!isOpenNow(exam)) throw closed('This exam is not open at the moment.');

  if (used >= exam.maxAttempts) throw bad('You have already used all ' + exam.maxAttempts + ' attempt(s) for this exam.');

    const queue = db.waiting.filter((w) => w.examId === examId).sort((a, b) => a.seq - b.seq).map((w) => w.studentId);

  if (!db.waiting.some((w) => w.examId === examId && w.studentId === s.id)) db.waiting.push({ examId, studentId: s.id, seq: nextId(db, 'wait') });

    durationMinutes: duration, totalQuestions: total, passingPercentage: pass, negativeMarks: negative, startTime, endTime,
    active: bool(body.active, false), shuffleQuestions: bool(body.shuffleQuestions, true), shuffleOptions: bool(body.shuffleOptions, true),
    allowReview: bool(body.allowReview, false), maxAttempts: attempts, maxConcurrent: concurrent,

  range(total, 1, 500, 'Total questions');

  range(negative, 0, 100, 'Negative marks');
  range(attempts, 1, 100, 'Maximum attempts');
  if (concurrent !== null) range(concurrent, 1, 100000, 'Maximum concurrent students');

function readQuestion(body, examId, questionId) {

  remainingSeconds() {

      button('Add question', 'primary', () => questionForm(current(), null, refreshExamsThenLoad)), info), holder));
  await load();
}

function questionForm(exam, question, onSaved) {
  const q = question || { text: '', options: ['', '', '', ''], correct: 'A', marks: 1 };
  const text = h('textarea', { rows: 3, maxlength: 5000, value: q.text });
  const opts = q.options.map((o) => h('input', { type: 'text', maxlength: 500, value: o }));
  const correct = h('select', null, ['A', 'B', 'C', 'D'].map((l) => h('option', { value: l, text: l, selected: q.correct === l })));
  correct.value = q.correct;
  const marks = h('input', { type: 'number', min: '0.01', step: '0.01', value: String(q.marks) });
  const message = h('p', { class: 'form-error', role: 'alert' });
  const lab = (t, el) => h('label', { class: 'field' }, h('span', { class: 'field-label', text: t }), el);
  openModal({
    title: question ? 'Edit question' : 'Add question to “' + exam.title + '”',
    wide: true,
    body: h('div', { class: 'form-grid' }, lab('Question *', text),
      opts.map((o, i) => lab('Option ' + 'ABCD'[i] + ' *', o)), lab('Correct option *', correct), lab('Marks *', marks), message),
    actions: [
      { label: 'Cancel', kind: 'secondary' },
      { label: 'Save question', kind: 'primary', onClick: async () => {
        message.textContent = '';
        const payload = { examId: exam.id, text: text.value, options: opts.map((o) => o.value), correct: correct.value, marks: marks.value };
        try {
          if (question) await put('/admin/questions/' + question.id, payload);
          else await post('/admin/exams/' + exam.id + '/questions', payload);
          toast('Question saved.', 'success');
          onSaved();
        } catch (err) {
          message.textContent = err.message;
          return false;
        }
        return true;
      } },
    ],
  });
}

// --------------------------------------------------------------------- attempts

async function attemptsTab(body) {
  mount(body, h('p', { class: 'muted', text: 'Loading…' }));
  let exams;
  try {
    exams = await get('/admin/exams');
  } catch (err) {
    mount(body, errorBlock(err, () => attemptsTab(body)));
    return;
  }
  const select = h('select', { 'aria-label': 'Exam' }, h('option', { value: '', text: 'All exams' }),
    exams.map((e) => h('option', { value: String(e.id), text: e.title })));
  const search = h('input', { type: 'search', placeholder: 'Search student name or email…', 'aria-label': 'Search students' });
  const summary = h('p', { class: 'summary' });
  const holder = h('div');
  let rows = [];
  let table = null;

  function filter() {
    const shown = rows.filter((a) => matches(a.student + ' ' + a.email, search.value));
    table.update(shown);
    const finished = shown.filter((a) => a.percentage !== null);
    const avg = finished.length ? fmtNum(finished.reduce((sum, a) => sum + Number(a.percentage), 0) / finished.length) + '%' : '-';
    const rate = finished.length ? Math.round(100 * finished.filter((a) => a.result === 'PASS').length / finished.length) + '%' : '-';
    summary.textContent = shown.length + ' attempt(s) | ' + finished.length + ' finished | average score ' + avg + ' | pass rate ' + rate;
  }

  async function load() {
    summary.textContent = 'Loading…';
    try {
      rows = await get('/admin/attempts' + (select.value ? '?examId=' + encodeURIComponent(select.value) : ''));
    } catch (err) {
      summary.textContent = '';
      mount(holder, errorBlock(err, load));
      return;
    }
    table = dataTable([
      { label: 'Attempt', render: (a) => String(a.attemptId) },
      { label: 'Student', render: (a) => h('div', null, h('strong', { text: a.student }), h('div', { class: 'muted small', text: a.email })) },
      { label: 'Exam', render: (a) => a.examTitle + ' (#' + a.attemptNo + ')' },
      { label: 'Started', render: (a) => fmtDate(a.startedAt) },
      { label: 'Submitted', render: (a) => fmtDate(a.submittedAt) },
      { label: 'Status', render: (a) => a.status.replace('_', ' ').toLowerCase() },
      { label: 'Score', render: (a) => (a.score === null ? '-' : fmtScore(a.score, a.maxScore)) },
      { label: '%', render: (a) => (a.percentage === null ? '-' : fmtNum(a.percentage) + '%') },
      { label: 'Result', render: (a) => resultBadge(a.result) },
    ], rows, 'No attempts yet.');
    mount(holder, table);
    filter();
  }

  select.addEventListener('change', load);
  search.addEventListener('input', () => { if (table) filter(); });
  mount(body, h('section', { class: 'panel' },
    h('div', { class: 'toolbar' }, h('label', { class: 'inline' }, h('span', { text: 'Exam' }), select), search,
      button('Refresh', 'secondary', load)), holder, summary));
  await load();
}

// --------------------------------------------------------------------- students

function studentsTab(body) {
  const search = h('input', { type: 'search', placeholder: 'Name or email…', 'aria-label': 'Search students' });
  const info = h('span', { class: 'muted' });
  const holder = h('div');
  async function load() {
    info.textContent = 'Searching…';
    try {
      const rows = await get('/admin/students?q=' + encodeURIComponent(search.value));
      info.textContent = rows.length + ' student(s)';
      mount(holder, dataTable([
        { label: 'ID', render: (s) => String(s.id) },
        { label: 'Name', render: (s) => s.name },
        { label: 'Email', render: (s) => s.email },
        { label: 'Registered', render: (s) => fmtDate(s.registeredAt) },
        { label: 'Attempts', render: (s) => String(s.attempts) },
      ], rows, 'No students found.'));
    } catch (err) {
      info.textContent = '';
      mount(holder, errorBlock(err, load));
    }
  }
  search.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  mount(body, h('section', { class: 'panel' },
    h('div', { class: 'toolbar' }, search, button('Search', 'primary', load), info), holder));
  load();
}
